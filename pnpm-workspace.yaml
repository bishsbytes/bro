  '@expo/vector-icons': ~15.1.0
  '@gorhom/bottom-sheet': ^5.2.14
  '@hono/node-server': ^2.1.0
  '@kingstinct/react-native-healthkit': 14.0.2
  '@nx/esbuild': 23.1.1
