packages:
  - "packages/*"
  - "packages/*/*"
  - "apps/*"
allowBuilds:
  # Optional drizzle-kit drivers we do not use (we use postgres.js and expo-sqlite).
  '@prisma/client': false
  better-sqlite3: false
  # Testcontainers' local Docker path does not need these transitive build scripts.
  cpu-features: false
  esbuild: true
  nx: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
autoInstallPeers: true
catalog:
  '@babel/runtime': ~7.27.6
  '@better-auth/expo': ^1.6.27
  '@biomejs/biome': ^2.5.7
  '@expo-google-fonts/archivo': ^0.4.2
