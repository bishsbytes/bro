packages:
  - "packages/*"
  - "packages/*/*"
  - "apps/*"
autoInstallPeers: true
allowBuilds:
  # Optional drizzle-kit drivers we do not use (we use postgres.js and expo-sqlite).
  '@prisma/client': false
  better-sqlite3: false
  # Testcontainers' local Docker path does not need these transitive build scripts.
  cpu-features: false
  esbuild: true
  nx: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.27'
  - '@better-auth/drizzle-adapter@1.6.27'
  - '@better-auth/expo@1.6.27'
  - '@better-auth/kysely-adapter@1.6.27'
  - '@better-auth/memory-adapter@1.6.27'
  - '@better-auth/mongo-adapter@1.6.27'
  - '@better-auth/prisma-adapter@1.6.27'
  - '@better-auth/telemetry@1.6.27'
  - better-auth@1.6.27
  - auth@1.6.27
