name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NX_TUI: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install package manager
        run: npm install --global pnpm@10.34.5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and imports
        run: pnpm biome check .
      - name: Check types, lint, and tests
        # GitHub's Ubuntu runner supplies Docker for the PostgreSQL integration tests.
        if: ${{ !cancelled() }}
        run: pnpm nx run-many -t typecheck lint test --parallel=2 --outputStyle=static
